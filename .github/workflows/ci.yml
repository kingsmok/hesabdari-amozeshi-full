# ═══════════════════════════════════════════════════════════════
# CI — بررسی خودکار هر push/PR (pip cache + pytest کامل + ruff)
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint (خطاهای قطعی: undefined names / bad syntax)
        run: ruff check --select E9,F821,F811 .

      - name: Compile all sources
        run: python -m compileall -q app.py config.py routes utils models tests

      - name: Run test suite
        env:
          ACADEMY_DISABLE_SCHEDULER: "1"
          ACADEMY_SQLITE_BUSY_TIMEOUT: "2"
        run: |
          python -m pytest -q
          # از «گذر صاف بدون چک‌اوت تازه» مطمئن می‌شویم (دیتابیس تازه نباید تست‌ها را بشکند)
