{% extends "base/layout.html" %}
{% block title %}حساب بانکی جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('finance.bank') }}">بانک</a></li>
<li class="active">حساب جدید</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-primary"></i>حساب بانکی جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label" for="bankName">نام بانک</label><input type="text" id="bankName" name="bank_name" class="form-control" maxlength="50" required></div>
                    <div class="col-md-4"><label class="form-label" for="bankAccountNumber">شماره حساب</label><input type="text" id="bankAccountNumber" name="account_number" class="form-control" maxlength="30" inputmode="numeric"></div>
                    <div class="col-md-4"><label class="form-label" for="bankCardNumber">شماره کارت</label><input type="text" id="bankCardNumber" name="card_number" class="form-control" maxlength="20" inputmode="numeric"></div>
                    <div class="col-md-4"><label class="form-label" for="bankSheba">شبا</label><input type="text" id="bankSheba" name="sheba" class="form-control" maxlength="30" dir="ltr"></div>
                    <div class="col-md-4"><label class="form-label" for="bankBranchName">نام شعبه بانک</label><input type="text" id="bankBranchName" name="branch_name" class="form-control" maxlength="100"></div>
                    <div class="col-md-4"><label class="form-label" for="bankOrganisationBranch">شعبه سازمانی</label><select id="bankOrganisationBranch" name="branch_id" class="form-select">{% if current_user.is_admin or not current_user.branch_id %}<option value="">مشترک بین شعب</option>{% endif %}{% for branch in branches %}<option value="{{ branch.id }}" {{ 'selected' if not current_user.is_admin and current_user.branch_id == branch.id }}>{{ branch.name }}</option>{% endfor %}</select></div>
                    <div class="col-md-4"><label class="form-label" for="bankOpeningBalance">موجودی اولیه</label><input type="number" id="bankOpeningBalance" name="balance" class="form-control" value="0" step="0.01" min="-10000000000000000" max="10000000000000000"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('finance.bank') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ذخیره</button>
        </div>
    </form>
</div>
{% endblock %}
