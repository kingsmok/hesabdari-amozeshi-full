{% extends "base/layout.html" %}
{% block title %}ثبت پرداخت{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('finance.payments') }}">مالی</a></li>
<li class="active">ثبت پرداخت</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-cash me-2 text-success"></i>ثبت پرداخت جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">هنرجو <span class="text-danger">*</span></label>
                        <select name="student_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید..." required>
                            <option value="">انتخاب...</option>
                            {% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">مبلغ <span class="text-danger">*</span></label><input type="number" name="amount" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">روش پرداخت</label>
                        <select name="payment_method" class="form-select">
                            <option value="cash">نقدی</option>
                            <option value="card">کارت بانکی</option>
                            <option value="online">آنلاین</option>
                            <option value="check">چک</option>
                        </select>
                    </div>
                    <div class="col-md-2"><label class="form-label">تاریخ</label><input type="date" name="payment_date" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">توضیحات</label><input type="text" name="description" class="form-control"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('finance.payments') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ثبت پرداخت</button>
        </div>
    </form>
</div>
{% endblock %}
