{% extends "base/layout.html" %}
{% block title %}ثبت شکایت{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('complaints.index') }}">شکایات</a></li>
<li class="active">ثبت شکایت</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-danger"></i>ثبت شکایت جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">نام شکایت‌کننده</label><input type="text" name="complainant_name" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">تلفن</label><input type="text" name="complainant_phone" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">هنرجوی مرتبط</label>
                        <select name="student_id" class="searchable" data-placeholder="جستجو و انتخاب کنید..." class="form-select">
                            <option value="">انتخاب...</option>
                            {% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6"><label class="form-label">موضوع <span class="text-danger">*</span></label><input type="text" name="subject" class="form-control" required></div>
                    <div class="col-md-12"><label class="form-label">توضیحات</label><textarea name="description" class="form-control" rows="4"></textarea></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('complaints.index') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ثبت</button>
        </div>
    </form>
</div>
{% endblock %}
