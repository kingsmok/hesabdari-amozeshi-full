{% extends "base/layout.html" %}
{% block title %}ایجاد کیبورد جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('bot_panel.dashboard') }}">پنل ربات</a></li>
<li><a href="{{ url_for('bot_panel.keyboards') }}">کیبوردها</a></li>
<li class="active">ایجاد کیبورد</li>
{% endblock %}

{% block content %}
<div class="anim-in">
    <div class="page-head">
        <h1>
            <i class="bi bi-plus-circle-fill" style="color: #10b981;"></i>
            ایجاد کیبورد جدید
            <small>دکمه‌های شیشه‌ای Reply یا Inline برای ربات</small>
        </h1>
    </div>

    <div class="glass-panel">
        <div class="glass-panel-body">
            <form method="POST" id="keyboardForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="buttons_data" id="buttons_data" value="[]">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="glass-label">نام کیبورد <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="glass-input" required placeholder="مثال: منوی اصلی">
                    </div>
                    <div class="col-md-3">
                        <label class="glass-label">نوع</label>
                        <select name="keyboard_type" class="glass-input" id="keyboardType">
                            <option value="reply">Reply (پایین صفحه)</option>
                            <option value="inline">Inline (داخل پیام)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="glass-label">پلتفرم</label>
                        <select name="provider" class="glass-input">
                            <option value="both">هر دو (بله + تلگرام)</option>
                            <option value="bale">فقط بله</option>
                            <option value="telegram">فقط تلگرام</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="glass-label">توضیحات</label>
                        <input type="text" name="description" class="glass-input" placeholder="توضیح کوتاه درباره این کیبورد">
                    </div>
                </div>

                <!-- ردیف‌های دکمه -->
                <div class="mt-4">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <label class="glass-label" style="margin: 0;">ردیف‌های دکمه</label>
                        <button type="button" class="glass-btn glass-btn-blue" onclick="addRow()"
                                style="flex-direction:row; gap:6px; padding: 8px 16px; font-size: 12px;">
                            <i class="bi bi-plus-lg"></i>
                            <span>افزودن ردیف</span>
                        </button>
                    </div>

                    <div id="rowsContainer" class="glass-rows-container">
                        <!-- ردیف‌ها اینجا اضافه می‌شوند -->
                    </div>
                </div>

                <button type="submit" class="glass-btn glass-btn-green" style="width: 100%; margin-top: 20px; padding: 14px;">
                    <i class="bi bi-check-circle-fill"></i>
                    <span style="font-size: 14px;">ذخیره کیبورد</span>
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    .glass-panel {
        background: rgba(255,255,255,.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
    .glass-panel-body { padding: 20px; }
    .glass-label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
    .glass-input {
        width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,.1); border-radius: 10px;
        background: rgba(255,255,255,.8); font-size: 13px; font-family: Vazirmatn,Tahoma,sans-serif; color: #1a1a2e;
    }
    .glass-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .glass-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        padding: 10px 14px; border-radius: 12px; text-decoration: none;
        font-size: 12px; font-weight: 600; color: white; border: 1px solid rgba(255,255,255,.2);
        cursor: pointer; transition: all 0.3s; font-family: Vazirmatn,Tahoma,sans-serif;
    }
    .glass-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.15); color: white; }
    .glass-btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .glass-btn-green { background: linear-gradient(135deg, #10b981, #059669); }

    .glass-rows-container { display: flex; flex-direction: column; gap: 10px; }
    .glass-row-item {
        padding: 12px; border-radius: 12px;
        background: rgba(255,255,255,.4); border: 1px solid rgba(0,0,0,.06);
    }
    .glass-row-header {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .glass-row-label { font-size: 11px; font-weight: 700; color: #6b7280; }
    .glass-row-actions { display: flex; gap: 6px; }
    .glass-row-btn {
        width: 26px; height: 26px; border-radius: 6px; border: none;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 12px; color: white; transition: all 0.2s;
    }
    .glass-row-btn:hover { transform: scale(1.1); }
    .glass-row-btn-add { background: linear-gradient(135deg, #10b981, #059669); }
    .glass-row-btn-del { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .glass-btn-input {
        flex: 1; padding: 8px 12px; border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
        background: rgba(255,255,255,.9); font-size: 12px; font-family: Vazirmatn,Tahoma,sans-serif;
        color: #1a1a2e;
    }
    .glass-btn-input:focus { outline: none; border-color: #3b82f6; }
    .glass-buttons-row { display: flex; gap: 8px; margin-bottom: 6px; }
</style>

<script>
let rowCount = 0;

function addRow() {
    rowCount++;
    const container = document.getElementById('rowsContainer');
    const row = document.createElement('div');
    row.className = 'glass-row-item';
    row.id = `row-${rowCount}`;
    row.innerHTML = `
        <div class="glass-row-header">
            <span class="glass-row-label">ردیف ${rowCount}</span>
            <div class="glass-row-actions">
                <button type="button" class="glass-row-btn glass-row-btn-add" onclick="addButton(${rowCount})" title="افزودن دکمه">
                    <i class="bi bi-plus"></i>
                </button>
                <button type="button" class="glass-row-btn glass-row-btn-del" onclick="removeRow(${rowCount})" title="حذف ردیف">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
        <div class="glass-buttons-container" id="buttons-${rowCount}">
        </div>
    `;
    container.appendChild(row);
    addButton(rowCount);
}

function addButton(rowId) {
    const container = document.getElementById(`buttons-${rowId}`);
    const btn = document.createElement('div');
    btn.className = 'glass-buttons-row';
    btn.innerHTML = `
        <input type="text" class="glass-btn-input" placeholder="متن دکمه">
        <button type="button" class="glass-row-btn glass-row-btn-del" onclick="this.parentElement.remove()" title="حذف">
            <i class="bi bi-x"></i>
        </button>
    `;
    container.appendChild(btn);
}

function removeRow(rowId) {
    document.getElementById(`row-${rowId}`).remove();
}

document.getElementById('keyboardForm').addEventListener('submit', function(e) {
    const rows = [];
    document.querySelectorAll('.glass-row-item').forEach(row => {
        const buttons = [];
        row.querySelectorAll('.glass-btn-input').forEach(input => {
            if (input.value.trim()) {
                buttons.push({text: input.value.trim()});
            }
        });
        if (buttons.length) rows.push(buttons);
    });
    document.getElementById('buttons_data').value = JSON.stringify(rows);
});

// اضافه کردن یک ردیف اولیه
addRow();
</script>
{% endblock %}
