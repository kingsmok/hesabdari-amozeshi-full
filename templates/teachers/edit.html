{% extends "base/layout.html" %}
{% block title %}ویرایش مدرس{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('teachers.index') }}">مدرسین</a></li>
<li class="active">ویرایش {{ teacher.full_name }}</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-pencil me-2 text-warning"></i>ویرایش مدرس<small>{{ teacher.full_name }}</small></h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-header-custom"><h5>اطلاعات فردی</h5></div>
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">نام</label><input type="text" name="first_name" class="form-control" value="{{ teacher.first_name }}" required></div>
                    <div class="col-md-3"><label class="form-label">نام خانوادگی</label><input type="text" name="last_name" class="form-control" value="{{ teacher.last_name }}" required></div>
                    <div class="col-md-3"><label class="form-label">موبایل</label><input type="text" name="mobile" class="form-control" value="{{ teacher.mobile }}" required></div>
                    <div class="col-md-3"><label class="form-label">تخصص</label><input type="text" name="specialization" class="form-control" value="{{ teacher.specialization or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">تحصیلات</label><input type="text" name="education" class="form-control" value="{{ teacher.education or '' }}"></div>
                    <div class="col-md-2"><label class="form-label">نرخ ساعتی</label><input type="number" name="hourly_rate" class="form-control" value="{{ teacher.hourly_rate or 0 }}"></div>
                    <div class="col-md-2"><label class="form-label">درصد</label><input type="number" name="percentage_rate" class="form-control" value="{{ teacher.percentage_rate or 0 }}"></div>
                    <div class="col-md-2"><label class="form-label">حقوق ثابت</label><input type="number" name="fixed_salary" class="form-control" value="{{ teacher.fixed_salary or 0 }}"></div>
                    <div class="col-md-2"><label class="form-label">سطح</label>
                        <select name="level" class="form-select">
                            <option value="beginner" {{ 'selected' if teacher.level=='beginner' }}>مبتدی</option>
                            <option value="intermediate" {{ 'selected' if teacher.level=='intermediate' }}>متوسط</option>
                            <option value="professional" {{ 'selected' if teacher.level=='professional' }}>حرفه‌ای</option>
                            <option value="master" {{ 'selected' if teacher.level=='master' }}>استاد ارشد</option>
                        </select>
                    </div>
                    <div class="col-md-2"><label class="form-label">وضعیت</label>
                        <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" name="is_active" {{ 'checked' if teacher.is_active }}><label class="form-check-label">فعال</label></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('teachers.view', id=teacher.id) }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ذخیره</button>
        </div>
    </form>
</div>
{% endblock %}
