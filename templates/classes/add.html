{% extends "base/layout.html" %}
{% block title %}ایجاد کلاس{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('classes.index') }}">کلاس‌ها</a></li>
<li class="active">ایجاد کلاس</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-success"></i>ایجاد کلاس جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-header-custom"><h5>اطلاعات کلاس</h5></div>
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">نام کلاس <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required></div>
                    <div class="col-md-4"><label class="form-label">دوره <span class="text-danger">*</span></label>
                        <select name="course_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید..." required>
                            <option value="">انتخاب...</option>
                            {% for c in courses %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4"><label class="form-label">مدرس</label>
                        <select name="teacher_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید...">
                            <option value="">انتخاب...</option>
                            {% for t in teachers %}<option value="{{ t.id }}">{{ t.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">اتاق</label>
                        <select name="room_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید...">
                            <option value="">انتخاب...</option>
                            {% for r in rooms %}<option value="{{ r.id }}">{{ r.name }} ({{ r.capacity }} نفر)</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2"><label class="form-label">ظرفیت</label><input type="number" name="max_capacity" class="form-control" value="20"></div>
                    <div class="col-md-2"><label class="form-label">ساعت شروع</label><input type="time" name="start_time" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">ساعت پایان</label><input type="time" name="end_time" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">روزهای تشکیل</label>
                        <select name="days" class="form-select" multiple>
                            <option value="0">شنبه</option><option value="1">یکشنبه</option><option value="2">دوشنبه</option>
                            <option value="3">سه‌شنبه</option><option value="4">چهارشنبه</option><option value="5">پنجشنبه</option>
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">تاریخ شروع</label><input type="date" name="start_date" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">تاریخ پایان</label><input type="date" name="end_date" class="form-control"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('classes.index') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ایجاد کلاس</button>
        </div>
    </form>
</div>
{% endblock %}
