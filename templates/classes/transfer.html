{% extends "base/layout.html" %}
{% block title %}انتقال هنرجو{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('classes.index') }}">کلاس‌ها</a></li>
<li class="active">انتقال</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-arrow-left-right me-2 text-warning"></i>انتقال هنرجو از {{ class_group.name }}</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">هنرجو</label>
                        <select name="student_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید..." required>
                            {% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4"><label class="form-label">کلاس مقصد</label>
                        <select name="to_class_id" class="form-select" required>
                            {% for c in all_classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4"><label class="form-label">دلیل</label><input type="text" name="reason" class="form-control"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('classes.view', id=class_group.id) }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>انتقال</button>
        </div>
    </form>
</div>
{% endblock %}
