{% extends "base/layout.html" %}
{% block title %}ارسال پیامک{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('messaging.send_sms') }}">پیام‌رسانی</a></li>
<li class="active">ارسال پیامک</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-send me-2 text-primary"></i>ارسال پیامک</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">گیرنده</label>
                        <select name="recipient_type" class="form-select">
                            <option value="student">هنرجو</option>
                            <option value="teacher">مدرس</option>
                        </select>
                    </div>
                    <div class="col-md-4"><label class="form-label">شماره موبایل</label><input type="text" name="phone" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">قالب</label>
                        <select class="form-select" onchange="if(this.value) document.querySelector('[name=message_text]').value=this.value;">
                            <option value="">انتخاب قالب...</option>
                            {% for t in templates %}<option value="{{ t.template_text }}">{{ t.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-12"><label class="form-label">متن پیام</label><textarea name="message_text" class="form-control" rows="4" required></textarea></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-send me-2"></i>ارسال</button>
        </div>
    </form>
</div>
{% endblock %}
