{% extends 'base/layout.html' %}
{% block title %}چاپ گروهی مدرک{% endblock %}
{% block content %}
<div class="animate-in">
  <h1><i class="bi bi-file-earmark-paper"></i> چاپ گروهی مدرک — {{ cert_type }}</h1>
  <div class="d-flex gap-2 mb-3">
    <a href="{{ url_for('certificates.index') }}" class="btn btn-outline-secondary">بازگشت</a>
    <button onclick="window.print()" class="btn btn-success-custom"><i class="bi bi-printer"></i> چاپ صفحه</button>
  </div>
  <div class="row g-3">
    {% for item in items %}
    <div class="col-md-6 col-lg-4">
      <a href="{{ url_for('certificates.beautiful_certificate', cert_type=cert_type, id=item.id) }}" class="btn btn-outline-primary w-100 mb-2" target="_blank">نمایش مدرک {{ item.full_name or item.name }}</a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
