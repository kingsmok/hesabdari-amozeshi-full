<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وضعیت لایسنس</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/Vazirmatn-font-face.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}">
    <style>
        * { font-family: Vazirmatn, Tahoma, Arial, sans-serif; box-sizing: border-box; }
        body { background: #f0f2f5; display: flex; min-height: 100vh; min-height: 100dvh; align-items: center;
               justify-content: center; margin: 0; color: #37474f; font-size: 13px; }
        .box { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.08);
               max-width: 480px; width: 100%; padding: 38px 34px; text-align: center; }
        .icon { width: 56px; height: 56px; border-radius: 50%; background: #ffebee; color: #c62828;
                display: flex; align-items: center; justify-content: center; font-size: 26px;
                margin: 0 auto 18px; }
        h1 { font-size: 17px; font-weight: 700; margin: 0 0 12px; color: #0a1628; }
        p { font-size: 13px; line-height: 2.1; color: #546e7a; margin: 0 0 8px; }
        .actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a.btn-link { display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none;
                     font-size: 12.5px; font-weight: 700; }
        .primary { background: linear-gradient(135deg, #0d47a1, #1565c0); color: #fff; }
        .ghost { background: #eceff1; color: #37474f; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon"><i class="bi bi-shield-exclamation"></i></div>
        <h1>دسترسی به نرم‌افزار امکان‌پذیر نیست</h1>
        <p>{{ reason }}</p>
        <div class="actions">
            <a class="btn-link primary" href="{{ url_for('license.activate') }}">
                <i class="bi bi-key"></i> ورود کلید لایسنس
            </a>
            <a class="btn-link ghost" href="{{ url_for('auth.logout') }}">
                <i class="bi bi-box-arrow-right"></i> خروج از سیستم
            </a>
        </div>
    </div>
</body>
</html>
