{% extends "base/layout.html" %}
{% block title %}پشتیبان‌گیری{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('settings.backup') }}">تنظیمات</a></li>
<li class="active">پشتیبان‌گیری</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-cloud-arrow-up me-2 text-info"></i>پشتیبان‌گیری</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="auto_backup" {{ 'checked' if settings.auto_backup }}><label class="form-check-label">پشتیبان خودکار</label></div>
                    </div>
                    <div class="col-md-3"><label class="form-label">فاصله (ساعت)</label><input type="number" name="backup_interval_hours" class="form-control" value="{{ settings.backup_interval_hours or 24 }}"></div>
                    <div class="col-md-3"><label class="form-label">حداکثر نسخه</label><input type="number" name="max_backups" class="form-control" value="{{ settings.max_backups or 30 }}"></div>
                    <div class="col-md-3"><label class="form-label">مسیر ذخیره</label><input type="text" name="backup_path" class="form-control" value="{{ settings.backup_path or '' }}"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ذخیره</button>
        </div>
    </form>
</div>
{% endblock %}
