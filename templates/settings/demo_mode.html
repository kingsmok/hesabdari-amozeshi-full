{% extends "base/layout.html" %}
{% block title %}نسخه آزمایشی{% endblock %}
{% block breadcrumb %}<li>تنظیمات</li><li class="active">نسخه آزمایشی</li>{% endblock %}
{% block content %}
<div class="anim-in">
    <div class="page-head"><h1><i class="bi bi-clock-history"></i> مدیریت نسخه آزمایشی</h1></div>
    <div class="card" style="max-width: 500px;">
        <div class="card-body-padded">
            <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3"><label class="form-label">مدت دوره آزمایشی (روز)</label>
                    <select name="trial_days" class="form-select"><option value="7">۷ روز</option><option value="14">۱۴ روز</option><option value="30" selected>۳۰ روز</option></select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> فعال‌سازی</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
