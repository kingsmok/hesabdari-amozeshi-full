{% extends "base/layout.html" %}
{% block title %}دوره جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('settings.courses') }}">دوره‌ها</a></li>
<li class="active">دوره جدید</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-primary"></i>دوره جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">عنوان</label><input type="text" name="title" class="form-control" required></div>
                    <div class="col-md-2"><label class="form-label">کد</label><input type="text" name="code" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">رشته</label>
                        <select name="field_id" class="searchable" data-placeholder="جستجو و انتخاب کنید..." class="form-select" required>
                            {% for f in fields %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">ساعات آموزشی</label><input type="number" name="duration_hours" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">تعداد جلسات</label><input type="number" name="total_sessions" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">شهریه پایه</label><input type="number" name="base_fee" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">ثبت‌نام</label><input type="number" name="registration_fee" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">کتاب</label><input type="number" name="book_fee" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">آزمون</label><input type="number" name="exam_fee" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">مدرک</label><input type="number" name="certificate_fee" class="form-control"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('settings.courses') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ایجاد</button>
        </div>
    </form>
</div>
{% endblock %}
