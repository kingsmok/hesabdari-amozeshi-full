{% extends "base/layout.html" %}
{% block title %}کارتخوان{% endblock %}
{% block breadcrumb %}<li>سخت‌افزار</li><li class="active">کارتخوان</li>{% endblock %}
{% block content %}
<div class="anim-in">
    <div class="page-head"><h1><i class="bi bi-credit-card-2-front"></i> تنظیمات کارتخوان بانکی</h1></div>
    <div class="card"><div class="card-body-padded">
        <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">بانک</label>
                    <select class="form-select"><option>ملی</option><option>ملت</option><option>صادرات</option><option>پاسارگاد</option></select>
                </div>
                <div class="col-md-4"><label class="form-label">شماره ترمینال</label><input type="text" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">شماره پذیرنده</label><input type="text" class="form-control"></div>
            </div>
            <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-check-circle me-1"></i> ذخیره</button>
        </form>
    </div></div>
</div>
{% endblock %}
