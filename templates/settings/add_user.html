{% extends "base/layout.html" %}
{% block title %}کاربر جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('settings.users') }}">کاربران</a></li>
<li class="active">کاربر جدید</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-person-plus me-2 text-primary"></i>ایجاد کاربر جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">نام کاربری <span class="text-danger">*</span></label><input type="text" name="username" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">رمز عبور <span class="text-danger">*</span></label><input type="password" name="password" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">نام کامل <span class="text-danger">*</span></label><input type="text" name="full_name" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">نقش</label>
                        <select name="role_id" class="form-select">
                            {% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">ایمیل</label><input type="email" name="email" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">تلفن</label><input type="text" name="phone" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">شعبه</label>
                        <select name="branch_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید...">
                            <option value="">همه شعب</option>
                            {% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">دسترسی</label>
                        <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" name="is_admin"><label class="form-check-label">مدیر کل</label></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('settings.users') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ایجاد کاربر</button>
        </div>
    </form>
</div>
{% endblock %}
