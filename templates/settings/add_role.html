{% extends "base/layout.html" %}
{% block title %}نقش جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('settings.roles') }}">نقش‌ها</a></li>
<li class="active">نقش جدید</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-warning"></i>ایجاد نقش جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">نام نقش</label><input type="text" name="name" class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label">توضیحات</label><input type="text" name="description" class="form-control"></div>
                    <div class="col-md-2"><label class="form-label">دسترسی</label>
                        <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" name="is_admin"><label class="form-check-label">مدیر</label></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('settings.roles') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ایجاد</button>
        </div>
    </form>
</div>
{% endblock %}
