{% extends "base/layout.html" %}
{% block title %}پاکسازی اطلاعات{% endblock %}
{% block breadcrumb %}<li>تنظیمات</li><li class="active">پاکسازی</li>{% endblock %}
{% block content %}
<div class="anim-in">
    <div class="page-head"><h1><i class="bi bi-trash3"></i> پاکسازی اطلاعات قدیمی</h1></div>
    <div class="card" style="max-width: 600px;">
        <div class="card-body-padded">
            <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">حذف لاگ‌های قدیمی‌تر از</label>
                        <select name="days" class="form-select"><option value="90">۳ ماه</option><option value="180">۶ ماه</option><option value="365" selected>۱ سال</option></select>
                    </div>
                    <div class="col-md-3"><label class="form-label">&nbsp;</label><button type="submit" name="action" value="preview" class="btn btn-outline-primary w-100">پیش‌نمایش</button></div>
                    <div class="col-md-3"><label class="form-label">&nbsp;</label><button type="submit" name="action" value="delete" class="btn btn-danger w-100" onclick="return confirm('مطمئن هستید؟')">پاکسازی</button></div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
