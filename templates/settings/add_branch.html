{% extends "base/layout.html" %}
{% block title %}شعبه جدید{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('settings.branches') }}">شعب</a></li>
<li class="active">شعبه جدید</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-plus-circle me-2 text-primary"></i>شعبه جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-custom mb-4">
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">نام شعبه</label><input type="text" name="name" class="form-control" required></div>
                    <div class="col-md-2"><label class="form-label">کد</label><input type="text" name="code" class="form-control" required></div>
                    <div class="col-md-3"><label class="form-label">مدیر</label><input type="text" name="manager_name" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">تلفن</label><input type="text" name="phone" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">آدرس</label><input type="text" name="address" class="form-control"></div>
                    <div class="col-md-2"><div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" name="is_main"><label class="form-check-label">شعبه اصلی</label></div></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('settings.branches') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ایجاد</button>
        </div>
    </form>
</div>
{% endblock %}
