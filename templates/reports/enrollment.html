{% extends "base/layout.html" %}
{% block title %}گزارش ثبت‌نام{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('reports.enrollment_report') }}">گزارش‌ها</a></li>
<li class="active">ثبت‌نام</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-graph-up me-2 text-warning"></i>گزارش ثبت‌نام</h1></div>
    <div class="card-custom">
        <div class="card-body-custom" style="padding: 0;">
            <table class="table table-custom mb-0">
                <thead><tr><th>دوره</th><th>تعداد</th></tr></thead>
                <tbody>
                    {% for item in by_field %}
                    <tr><td>{{ item[1] }}</td><td>{{ item[0] }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
