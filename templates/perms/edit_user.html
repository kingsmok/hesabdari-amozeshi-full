{% extends "base/layout.html" %}
{% block title %}ویرایش {{ user.full_name }}{% endblock %}
{% block breadcrumb %}<li><a href="{{ url_for('perms.users_list') }}">کاربران</a></li><li class="active">{{ user.full_name }}</li>{% endblock %}
{% block content %}
<div class="anim-in">
    <div class="page-head"><h1><i class="bi bi-pencil"></i> ویرایش کاربر<small>{{ user.full_name }}</small></h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card mb-4">
            <div class="card-head"><h5>اطلاعات حساب</h5></div>
            <div class="card-body-padded">
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">نام کاربری</label><input type="text" class="form-control" value="{{ user.username }}" disabled></div>
                    <div class="col-md-3"><label class="form-label">رمز جدید (خالی = بدون تغییر)</label><input type="password" name="password" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">نام کامل</label><input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required></div>
                    <div class="col-md-3"><label class="form-label">نقش</label>
                        <select name="role_id" class="form-select">{% for r in roles %}<option value="{{ r.id }}" {{ 'selected' if r.id == user.role_id }}>{{ r.name }}</option>{% endfor %}</select>
                    </div>
                    <div class="col-md-3"><label class="form-label">ایمیل</label><input type="email" name="email" class="form-control" value="{{ user.email or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">تلفن</label><input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">شعبه</label>
                        <select name="branch_id" class="form-select"><option value="">همه شعب</option>{% for b in branches %}<option value="{{ b.id }}" {{ 'selected' if b.id == user.branch_id }}>{{ b.name }}</option>{% endfor %}</select>
                    </div>
                    <div class="col-md-3">
                        <div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" name="is_active" {{ 'checked' if user.is_active }}><label class="form-check-label">فعال</label></div>
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_admin" {{ 'checked' if user.is_admin }}><label class="form-check-label">مدیر کل</label></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('perms.users_list') }}" class="btn btn-outline-secondary">بازگشت</a>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-2"></i> ذخیره</button>
        </div>
    </form>
</div>
{% endblock %}
