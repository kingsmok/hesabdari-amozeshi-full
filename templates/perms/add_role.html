{% extends "base/layout.html" %}
{% block title %}نقش جدید{% endblock %}
{% block breadcrumb %}<li><a href="{{ url_for('perms.roles_list') }}">نقش‌ها</a></li><li class="active">جدید</li>{% endblock %}
{% block content %}
<div class="anim-in">
    <div class="page-head"><h1><i class="bi bi-plus-circle"></i> ایجاد نقش جدید</h1></div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card mb-4" style="max-width: 600px;">
            <div class="card-body-padded">
                <div class="row g-3">
                    <div class="col-md-8"><label class="form-label">نام نقش <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required placeholder="مثال: منشی، حسابدار، مدرس"></div>
                    <div class="col-md-4"><label class="form-label">دسترسی</label>
                        <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" name="is_admin"><label class="form-check-label">مدیر کل</label></div>
                    </div>
                    <div class="col-md-12"><label class="form-label">توضیحات</label><input type="text" name="description" class="form-control" placeholder="شرح مختصر نقش"></div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('perms.roles_list') }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-2"></i> ایجاد و تنظیم دسترسی</button>
        </div>
    </form>
</div>
{% endblock %}
