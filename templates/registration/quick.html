{% extends "base/layout.html" %}
{% block title %}ثبت‌نام سریع{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('registration.index') }}">ثبت‌نام</a></li>
<li class="active">ثبت‌نام سریع</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header"><h1><i class="bi bi-lightning me-2 text-warning"></i>ثبت‌نام سریع<small>فرم سریع برای منشی</small></h1></div>
    <div class="card-custom">
        <div class="card-body-custom">
            <form method="POST" action="{{ url_for('registration.add') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">هنرجو <span class="text-danger">*</span></label>
                        <select name="student_id" class="form-select searchable" data-placeholder="جستجو و انتخاب کنید..." required>
                            <option value="" selected disabled>انتخاب...</option>
                            {% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4"><label class="form-label">کلاس و دوره <span class="text-danger">*</span></label>
                        <select name="class_id" id="quickClass" class="form-select searchable" data-placeholder="کلاس را انتخاب کنید..." required>
                            <option value="" selected disabled>انتخاب...</option>
                            {% for c in classes %}<option value="{{ c.id }}" data-course="{{ c.course_id }}">{{ c.name }} — {{ c.course.title if c.course else '-' }}</option>{% endfor %}
                        </select>
                        <input type="hidden" name="course_id" id="quickCourse">
                    </div>
                    <div class="col-md-4"><label class="form-label">پرداخت</label><input type="number" name="initial_payment" class="form-control" value="0"></div>
                </div>
                <button type="submit" class="btn btn-success-custom mt-3"><i class="bi bi-check-circle me-2"></i>ثبت سریع</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
    const classSelect = document.getElementById('quickClass');
    const courseInput = document.getElementById('quickCourse');
    function syncCourse() {
        const option = classSelect.options[classSelect.selectedIndex];
        courseInput.value = option ? (option.dataset.course || '') : '';
    }
    classSelect.addEventListener('change', syncCourse);
    syncCourse();
})();
</script>
{% endblock %}
