{% extends "base/layout.html" %}
{% block title %}ویرایش {{ student.full_name }}{% endblock %}
{% block breadcrumb %}
<li><a href="{{ url_for('students.index') }}">هنرجویان</a></li>
<li class="active">ویرایش {{ student.full_name }}</li>
{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="page-header">
        <h1><i class="bi bi-pencil me-2 text-warning"></i>ویرایش هنرجو<small>{{ student.full_name }}</small></h1>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="card-custom mb-4">
            <div class="card-header-custom"><h5>اطلاعات شخصی</h5></div>
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">نام</label><input type="text" name="first_name" class="form-control" value="{{ student.first_name }}" required></div>
                    <div class="col-md-3"><label class="form-label">نام خانوادگی</label><input type="text" name="last_name" class="form-control" value="{{ student.last_name }}" required></div>
                    <div class="col-md-3"><label class="form-label">نام پدر</label><input type="text" name="father_name" class="form-control" value="{{ student.father_name or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">کد ملی</label><input type="text" name="national_code" class="form-control" value="{{ student.national_code or '' }}" maxlength="10"></div>
                    <div class="col-md-3"><label class="form-label">موبایل</label><input type="text" name="mobile" class="form-control" value="{{ student.mobile }}" required></div>
                    <div class="col-md-3"><label class="form-label">تلفن</label><input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">ایمیل</label><input type="email" name="email" class="form-control" value="{{ student.email or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">جنسیت</label>
                        <select name="gender" class="form-select">
                            <option value="">انتخاب</option>
                            <option value="male" {{ 'selected' if student.gender=='male' }}>مرد</option>
                            <option value="female" {{ 'selected' if student.gender=='female' }}>زن</option>
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">تحصیلات</label><input type="text" name="education_level" class="form-control" value="{{ student.education_level or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">شغل</label><input type="text" name="job" class="form-control" value="{{ student.job or '' }}"></div>
                    <div class="col-md-3"><label class="form-label">دسته‌بندی</label>
                        <select name="category" class="form-select">
                            <option value="">انتخاب</option>
                            <option value="teen" {{ 'selected' if student.category=='teen' }}>نوجوان</option>
                            <option value="adult" {{ 'selected' if student.category=='adult' }}>بزرگسال</option>
                            <option value="vip" {{ 'selected' if student.category=='vip' }}>VIP</option>
                            <option value="corporate" {{ 'selected' if student.category=='corporate' }}>سازمانی</option>
                        </select>
                    </div>
                    <div class="col-md-3"><label class="form-label">وضعیت</label>
                        <select name="status" class="form-select">
                            <option value="active" {{ 'selected' if student.status=='active' }}>فعال</option>
                            <option value="graduated" {{ 'selected' if student.status=='graduated' }}>فارغ‌التحصیل</option>
                            <option value="withdrawn" {{ 'selected' if student.status=='withdrawn' }}>انصرافی</option>
                            <option value="suspended" {{ 'selected' if student.status=='suspended' }}>تعلیق</option>
                        </select>
                    </div>
                    <div class="col-md-6"><label class="form-label">آدرس</label><input type="text" name="address" class="form-control" value="{{ student.address or '' }}"></div>
                    <div class="col-md-6"><label class="form-label">توضیحات</label><input type="text" name="notes" class="form-control" value="{{ student.notes or '' }}"></div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mb-4">
            <a href="{{ url_for('students.view', id=student.id) }}" class="btn btn-outline-secondary">انصراف</a>
            <button type="submit" class="btn btn-success-custom"><i class="bi bi-check-circle me-2"></i>ذخیره تغییرات</button>
        </div>
    </form>
</div>
{% endblock %}
